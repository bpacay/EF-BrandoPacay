<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Estudiantes</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">Registro de Estudiantes</a>
      <nav class="nav">
        <a href="index.html">Registro</a>
        <a href="consulta.html" aria-current="page">Consulta</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container wide">
      <h1>Estudiantes registrados</h1>
      <p class="subtitle">Datos obtenidos del web service (<code>GET /api/estudiantes</code>).</p>

      <div id="alerta" class="alert alert-error" role="alert" hidden></div>

      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="buscador" placeholder="Buscar por carné, nombre, correo, carrera, teléfono…" aria-label="Buscar estudiantes">
        </div>
        <button type="button" id="btnActualizar" class="btn btn-secondary">
          <svg id="iconoActualizar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          Actualizar
        </button>
        <span class="count" id="contador"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Carné</th>
              <th>Nombres</th>
              <th>Apellidos</th>
              <th>Correo</th>
              <th>Carrera</th>
              <th>Teléfono</th>
              <th>Fecha de nacimiento</th>
              <th>Género</th>
              <th>Fecha de registro</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="10" class="empty">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/consulta.js"></script>
</body>
</html>
